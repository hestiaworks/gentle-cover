name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          # The brands check wants the domain in home-assistant/brands, which
          # is for integrations shipped with Home Assistant. This one is
          # installed from here and never will be.
          ignore: brands

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # The tests need no Home Assistant: the planning is pure, and the move
      # runner is tested against a stand-in (tests/ha_stub.py).
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
